<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Fornecedor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        .warning {
            background-color: #fff3cd;
            border: 1px solid #ffecb5;
            color: #664d03;
            padding: 16px;
            border-radius: 6px;
            margin: 20px 0;
        }
        button {
            background-color: #dc3545;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        a {
            text-decoration: none;
            color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Excluir Fornecedor</h1>

        <div class="warning">
            Tem certeza que deseja excluir o fornecedor <strong>{{ object.nome_fantasia }}</strong>?
        </div>

        <form method="post">
            {% csrf_token %}
            <button type="submit">Confirmar Exclusão</button>
            <a href="{% url 'fornecedores_lista' %}">Cancelar</a>
        </form>
    </div>
</body>
</html>
