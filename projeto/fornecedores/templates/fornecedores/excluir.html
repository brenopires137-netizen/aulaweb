{% extends 'base_sidebar.html' %}

{% block title %}Excluir Fornecedor{% endblock %}

{% block content %}
<h1 class="page-title">Excluir Fornecedor</h1>

<div class="panel" style="max-width: 640px;">
    <div class="warning-box">
        Tem certeza que deseja excluir o fornecedor <strong>{{ object.nome_fantasia }}</strong>?
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar Exclusao</button>
        <a href="{% url 'fornecedores_lista' %}" class="btn btn-muted">Cancelar</a>
    </form>
</div>
{% endblock %}
