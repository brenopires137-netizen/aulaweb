<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Gestao{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: #ecf0f1;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background-color: #34495e;
            border-bottom: 1px solid #21303f;
        }

        .sidebar-header h1 {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: 0.85rem;
            color: #b9c3cc;
        }

        .sidebar nav {
            padding: 16px 0;
            flex: 1;
        }

        .menu-item {
            display: block;
            color: #ecf0f1;
            text-decoration: none;
            padding: 11px 20px;
            border-left: 3px solid transparent;
            font-size: 0.95rem;
        }

        .menu-item:hover {
            background-color: #34495e;
            border-left-color: #95a5a6;
        }

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 28px;
        }

        .page-title {
            color: #2c3e50;
            margin-bottom: 18px;
        }

        .panel {
            background-color: #fff;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .actions {
            margin-bottom: 14px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
            border: 1px solid transparent;
            margin-right: 8px;
            font-size: 0.92rem;
            cursor: pointer;
        }

        .btn-primary { background: #4b6b8a; color: #fff; }
        .btn-muted { background: #6c757d; color: #fff; }
        .btn-warning { background: #d8b24c; color: #222; }
        .btn-danger { background: #c05a5a; color: #fff; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th, td {
            border-bottom: 1px solid #e6e6e6;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #e9eef2;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            border: 1px solid #d6d6d6;
            border-radius: 4px;
            padding: 8px;
            font-size: 0.95rem;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .errorlist {
            color: #b94a48;
            margin: 8px 0;
            padding-left: 18px;
        }

        .warning-box {
            background: #f8f2d9;
            border: 1px solid #e5d7a4;
            border-radius: 5px;
            color: #6b5b27;
            padding: 14px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 16px;
            }

            body {
                flex-direction: column;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Sistema de Gestao</h1>
            <p>Painel</p>
        </div>
        <nav>
            <a class="menu-item" href="{% url 'home' %}">Inicio</a>
            <a class="menu-item" href="{% url 'lista' %}">Clientes</a>
            <a class="menu-item" href="{% url 'produtos_lista' %}">Produtos</a>
            <a class="menu-item" href="{% url 'fornecedores_lista' %}">Fornecedores</a>
            <a class="menu-item" href="{% url 'compras_lista' %}">Compras</a>
            <a class="menu-item" href="{% url 'vendas_lista' %}">Vendas</a>
            {% if request.user.is_staff %}
                <a class="menu-item" href="/admin/">Administracao</a>
            {% endif %}
            <form method="post" action="{% url 'logout' %}" style="padding: 0 20px; margin-top: 10px;">
                {% csrf_token %}
                <button type="submit" class="btn btn-muted" style="width: 100%; margin-right: 0;">Sair</button>
            </form>
        </nav>
    </aside>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
